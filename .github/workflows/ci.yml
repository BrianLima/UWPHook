name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # GitHubActions logger: each failed test becomes an error annotation.
      # TRX logger: feeds the summary step below.
      - name: Test
        run: >-
          dotnet test UWPHook.Core.Tests -c Release
          --logger GitHubActions
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Summarize tests
        if: always()
        shell: bash
        run: |
          # GitHub runs bash with -eo pipefail, so guard against a missing TestResults folder.
          trx=$( { find TestResults -name '*.trx' 2>/dev/null || true; } | head -n 1)
          if [ -z "$trx" ]; then
            echo "::notice title=Test summary::no test results (the build failed before tests ran)"
            exit 0
          fi
          counters=$(grep -o '<Counters [^>]*>' "$trx" | head -n 1)
          attr() { sed -n "s/.* $1=\"\([0-9]*\)\".*/\1/p" <<<"$counters"; }
          echo "::notice title=Test summary::$(attr passed)/$(attr total) passed, $(attr failed) failed"

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build UWPHook.slnx -c Release "-flp:warningsonly;logfile=build-warnings.log"

      # GitHub shows at most 10 warning annotations per step, so also report the full count.
      - name: Summarize build warnings
        shell: pwsh
        run: |
          $warnings = @(Get-Content build-warnings.log | Where-Object { $_ -match 'warning [A-Z]+[0-9]+' } | Sort-Object -Unique)
          $byCode = $warnings | ForEach-Object { [regex]::Match($_, 'warning ([A-Z]+[0-9]+)').Groups[1].Value } |
            Group-Object | Sort-Object Count -Descending | ForEach-Object { "$($_.Name)=$($_.Count)" }
          Write-Output "::notice title=build warnings::$($warnings.Count) unique warnings ($($byCode -join ', '))"

      - name: Publish win-x64
        run: dotnet publish UWPHook/UWPHook.csproj -c Release -r win-x64 -o publish/win-x64

      - name: Publish win-arm64
        run: dotnet publish UWPHook/UWPHook.csproj -c Release -r win-arm64 -o publish/win-arm64

      - name: Summarize publish output
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            $files = Get-ChildItem "publish/$rid" -File | ForEach-Object { "$($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }
            Write-Output "::notice title=publish $rid::$($files -join ', ')"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: UWPHook-win-x64
          path: publish/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: UWPHook-win-arm64
          path: publish/win-arm64
